name: Release

on:
  push:
    tags: ["v*"]

jobs:
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: github-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev clang cmake make
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          fi

      - name: Build
        env:
          CARGO_PROFILE_RELEASE_LTO: false
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 8
        run: cargo build --locked --release --target ${{ matrix.target }} -p chapeaux-geoff

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../geoff-${{ matrix.target }}.tar.gz geoff

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: geoff-${{ matrix.target }}.tar.gz

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: github-release
    if: github.repository == 'chapeaux/geoff'
    environment: npm
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev clang cmake make

      - name: Publish crates (in dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          publish() {
            echo "Publishing $1..."
            local output
            if output=$(cargo publish -p "$1" --no-verify 2>&1); then
              echo "$1 published successfully"
            elif echo "$output" | grep -q "already exists"; then
              echo "$1 already published, skipping"
            else
              echo "$output"
              echo "Failed to publish $1"
              return 1
            fi
            sleep 15
          }

          # Layer 0: no internal deps
          publish geoff-core
          publish geoff-theme

          # Layer 1: depends on core
          publish geoff-graph

          # Layer 2: depends on core + graph
          publish geoff-ontology
          publish geoff-plugin

          # Layer 3: depends on layers 0-2
          publish geoff-content
          publish geoff-deno

          # Layer 4: depends on layers 0-3
          publish geoff-render

          # Layer 5: depends on all
          publish geoff-server

          # Binary crate
          publish chapeaux-geoff
