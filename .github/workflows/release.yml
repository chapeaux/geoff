name: Release

on:
  push:
    tags: ["v*"]

jobs:
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: github-release
    if: github.repository == 'chapeaux/geoff'
    environment: npm
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev clang cmake make

      - name: Publish crates (in dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          publish() {
            echo "Publishing $1..."
            local output
            if output=$(cargo publish -p "$1" --no-verify 2>&1); then
              echo "$1 published successfully"
            elif echo "$output" | grep -q "already exists"; then
              echo "$1 already published, skipping"
            else
              echo "$output"
              echo "Failed to publish $1"
              return 1
            fi
            sleep 15
          }

          # Layer 0: no internal deps
          publish geoff-core
          publish geoff-theme

          # Layer 1: depends on core
          publish geoff-graph

          # Layer 2: depends on core + graph
          publish geoff-ontology
          publish geoff-plugin

          # Layer 3: depends on layers 0-2
          publish geoff-content
          publish geoff-deno

          # Layer 4: depends on layers 0-3
          publish geoff-render

          # Layer 5: depends on all
          publish geoff-server

          # Binary crate
          publish chapeaux-geoff
