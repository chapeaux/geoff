[package]
name = "geoff-sparql-wasm"
version = "0.4.2"
edition = "2024"
license = "MIT"
description = "WASM SPARQL engine for Geoff sites — query RDF graphs in browser and AI agents"
repository = "https://github.com/chapeaux/geoff"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
oxigraph = { version = "0.5", default-features = false }
serde_json = "1"
js-sys = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true
