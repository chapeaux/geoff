[package]
name = "chapeaux-geoff"
version = "0.5.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Semantically rich static site generator built on W3C web standards"
keywords = ["static-site", "rdf", "sparql", "semantic-web", "jamstack"]
categories = ["web-programming", "template-engine", "command-line-utilities"]
include = ["src/**/*", "components/**/*", "Cargo.toml"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/geoff-{ target }.tar.gz"
bin-dir = "geoff"
pkg-fmt = "tgz"

[[bin]]
name = "geoff"
path = "src/main.rs"

[dependencies]
geoff-core = { version = "0.5.0", path = "../geoff-core" }
geoff-graph = { version = "0.5.0", path = "../geoff-graph" }
geoff-content = { version = "0.5.0", path = "../geoff-content" }
geoff-render = { version = "0.5.0", path = "../geoff-render" }
geoff-server = { version = "0.5.0", path = "../geoff-server" }
geoff-ontology = { version = "0.5.0", path = "../geoff-ontology" }
geoff-plugin = { version = "0.5.0", path = "../geoff-plugin" }
geoff-deno = { version = "0.5.0", path = "../geoff-deno" }
geoff-theme = { version = "0.5.0", path = "../geoff-theme" }
clap = { version = "4", features = ["derive"] }
colored = "3"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
serde_json = "1"
camino = "1"
lightningcss = "1.0.0-alpha.71"
image = "0.25"
sha2 = "0.10"
walkdir = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
zip = "2"
swc_common = "21"
swc_ecma_ast = "23"
swc_ecma_parser = "39"
swc_ecma_codegen = "26"

[dev-dependencies]
