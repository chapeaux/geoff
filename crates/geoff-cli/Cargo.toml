[package]
name = "chapeaux-geoff"
version = "0.4.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Semantically rich static site generator built on W3C web standards"
keywords = ["static-site", "rdf", "sparql", "semantic-web", "jamstack"]
categories = ["web-programming", "template-engine", "command-line-utilities"]
include = ["src/**/*", "components/**/*", "Cargo.toml"]

[[bin]]
name = "geoff"
path = "src/main.rs"

[dependencies]
geoff-core = { version = "0.4.1", path = "../geoff-core" }
geoff-graph = { version = "0.4.1", path = "../geoff-graph" }
geoff-content = { version = "0.4.1", path = "../geoff-content" }
geoff-render = { version = "0.4.1", path = "../geoff-render" }
geoff-server = { version = "0.4.1", path = "../geoff-server" }
geoff-ontology = { version = "0.4.1", path = "../geoff-ontology" }
geoff-plugin = { version = "0.4.1", path = "../geoff-plugin" }
geoff-deno = { version = "0.4.1", path = "../geoff-deno" }
geoff-theme = { version = "0.4.1", path = "../geoff-theme" }
clap = { version = "4", features = ["derive"] }
colored = "3"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
serde_json = "1"
camino = "1"
lightningcss = "1.0.0-alpha.71"
image = "0.25"
sha2 = "0.10"
walkdir = "2"
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
zip = "2"

[dev-dependencies]
